# sonar-project.properties

# Path to source code
sonar.sources=src

# Path to test files (important for .spec.ts)
sonar.tests=src

# Language-specific includes
sonar.inclusions=**/*.ts
sonar.test.inclusions=**/*.spec.ts

# (Optional) Exclude test files from main source analysis
sonar.exclusions=**/*.spec.ts, **/shared/rsi-topbar/rsi-topbar.component.ts,**/helpers/submit-draft-helper.service.ts

# TypeScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
