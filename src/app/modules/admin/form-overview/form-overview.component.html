<app-module-layout>
  <app-sync-mode [isSyncInProgress]="isSyncInProgress" />
  <div style="width: calc(100vw - 60px); position: relative; left: 60px">
    <div
      class="d-flex flex-wrap justify-content-between align-items-center px-4 header-bg text-black main-heading"
      style="margin-top: -3px"
    >
      <div class="d-flex align-items-center gap-3">
        <kendo-textbox
          [readonly]="true"
          [value]="formTitle"
          class="k-custom-width k-rounded-md k-input-outline k-input-lg"
        ></kendo-textbox>
        <button
          kendoButton
          type="button"
          fillMode="clear"
          themeColor="primary"
          class="px-0 font-15px"
          (click)="showExportDialog()"
        >
          EXPORT<app-fa-download-icon />
        </button>
      </div>
      <button
        kendoButton
        type="button"
        themeColor="primary"
        fillMode="clear"
        (click)="goBack()"
        class="h-40px"
      >
        <app-fa-arrow-left-icon />BACK
      </button>
    </div>
    <div class="container-fluid p-4">
      <div class="custom-box-shadow">
        <div
          class="d-flex justify-content-between align-items-center k-rounded-lg k-custom-rounded-top"
        >
          <p
            class="m-0 fw-medium"
            style="font-size: 20px; max-width: max-content"
          >
            Form Overview
          </p>
          <button
            kendoButton
            type="button"
            themeColor="primary"
            (click)="assignNewCustomer()"
            class="h-40px"
          >
            ASSIGN CUSTOMER
          </button>
        </div>
        <div class="border" *ngIf="isLoading">
          <app-loading-spinner [isLoading]="isLoading" [isRelative]="true" />
        </div>
        <div
          *ngIf="!isLoading"
          style="height: calc(100vh - 238px) !important; overflow: hidden"
        >
          <kendo-grid
            scrollable="scrollable"
            style="max-height: 100%"
            [data]="gridView"
            [pageSize]="pageSize"
            [skip]="gridState.skip"
            [pageable]="true"
            [sortable]="true"
            [sort]="gridState.sort"
            filterable="menu"
            [filter]="gridState.filter"
            (dataStateChange)="onDataStateChange($event)"
            ><kendo-grid-column
              field="CustomerName"
              title="Customer Assigned"
              [width]="250"
            >
            </kendo-grid-column
            ><kendo-grid-column field="YardName" title="Yard" [width]="180">
            </kendo-grid-column
            ><kendo-grid-column
              field="ContactPerson"
              title="Contact Person"
              [width]="180"
            >
            </kendo-grid-column
            ><kendo-grid-column field="Email" title="User ID" [width]="230">
            </kendo-grid-column
            ><kendo-grid-column field="PhoneNo" title="Phone No." [width]="180"
              ><ng-template kendoGridCellTemplate let-forms>{{
                forms.PhoneNo || 'N/A'
              }}</ng-template></kendo-grid-column
            >
            <kendo-grid-column
              field="action"
              title="Action"
              [headerStyle]="{ 'justify-content': 'center' }"
              [width]="210"
              [filterable]="false"
              [sortable]="false"
              ><ng-template kendoGridCellTemplate let-form>
                <div class="d-flex gap-4 justify-content-center">
                  <a
                    class="cursor-pointer anchor"
                    (click)="InspectionFormDetailGetById(form)"
                    style="color: #346cab"
                  >
                    START INSPECTION
                  </a>
                  <a
                    class="cursor-pointer anchor"
                    (click)="unassignInspection(form)"
                    style="color: #fd0d0d"
                  >
                    UNASSIGN FORM
                  </a>
                </div>
              </ng-template></kendo-grid-column
            >
          </kendo-grid>
        </div>
      </div>
    </div>
  </div>
</app-module-layout>

<app-kendo-export-dialog
  *ngIf="exportDialogVisible"
  (closeDialog)="onExportDialogClose($event)"
/>

<kendo-confirm-dialog
  *ngIf="dialogVisible"
  [title]="'Are you sure?'"
  [type]="'danger'"
  [message]="
    'This is an irreversible action. Would you like to move forward with unassigning the form?'
  "
  (closeDialog)="handleDialogClose($event)"
/>
