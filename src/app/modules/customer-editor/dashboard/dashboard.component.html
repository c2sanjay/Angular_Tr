<app-module-layout>
  <app-sync-mode [isSyncInProgress]="isSyncInProgress" />
  <div style="width: calc(100vw - 60px); position: relative; left: 60px">
    <div
      class="d-flex flex-wrap align-items-center gap-3 header-bg text-black main-heading px-4"
      style="margin-top: -3px"
    >
      <kendo-dropdownlist
        [data]="railYards"
        [(ngModel)]="selectedRailYard"
        [textField]="'Name'"
        [valueField]="'Id'"
        [valuePrimitive]="false"
        placeholder="All"
        (valueChange)="onDropdownChange($event)"
        class="k-custom-width k-rounded-md k-input-outline k-picker-lg"
        style="background-color: white !important"
      >
      </kendo-dropdownlist>
      <button
        kendoButton
        type="button"
        fillMode="clear"
        themeColor="primary"
        class="px-0 font-15px"
        (click)="showExportDialog()"
      >
        EXPORT<app-fa-download-icon />
      </button>
    </div>
    <div class="container-fluid p-4 bg-white">
      <div class="d-flex flex-wrap align-items-end mb-4 gap-4">
        <div class="d-flex gap-4">
          <kendo-label
            text="START DATE"
            style="font-size: 11px"
            class="fw-semibold"
          >
            <kendo-datepicker
              class="k-rounded-md k-input-outline h-40px"
              style="background-color: white !important"
              [max]="endDateKendo"
              [value]="startDateKendo"
              (valueChange)="onDateChange($event, 'startDate')"
              format="MM/dd/yyyy"
            ></kendo-datepicker>
          </kendo-label>
          <kendo-label
            text="END DATE"
            style="font-size: 11px"
            class="fw-semibold"
          >
            <kendo-datepicker
              class="k-rounded-md k-input-outline h-40px"
              style="background-color: white !important"
              [min]="startDateKendo"
              [value]="endDateKendo"
              (valueChange)="onDateChange($event, 'endDate')"
              format="MM/dd/yyyy"
            ></kendo-datepicker>
          </kendo-label>
        </div>
        <kendo-buttongroup selection="single">
          <button
            kendoButton
            [toggleable]="true"
            (click)="onBtnGroupClick('today')"
            [selected]="dateRangeSelected === 'today'"
            class="px-3 k-rounded-md k-border-primary"
          >
            TODAY
          </button>
          <button
            kendoButton
            [toggleable]="true"
            (click)="onBtnGroupClick('last7days')"
            [selected]="dateRangeSelected === 'last7days'"
            class="px-3 k-rounded-md k-border-primary"
          >
            7 DAYS
          </button>
          <button
            kendoButton
            [toggleable]="true"
            (click)="onBtnGroupClick('last30days')"
            [selected]="dateRangeSelected === 'last30days'"
            class="px-3 k-rounded-md k-border-primary"
          >
            1 MONTH
          </button>
        </kendo-buttongroup>
      </div>
      <div class="custom-box-shadow">
        <div
          class="d-flex justify-content-between align-items-center k-rounded-lg k-custom-rounded-top"
        >
          <p
            class="m-0 fw-medium"
            style="font-size: 20px; max-width: max-content"
          >
            Inspection Hub
          </p>
        </div>
        <div class="border" *ngIf="isLoading">
          <app-loading-spinner [isLoading]="isLoading" [isRelative]="true" />
        </div>
        <div
          *ngIf="!isLoading"
          style="height: calc(100vh - 302) !important; overflow: hidden"
        >
          <kendo-grid
            scrollable="scrollable"
            style="max-height: 100%"
            [data]="gridView"
            [pageSize]="pageSize"
            [skip]="gridState.skip"
            [pageable]="true"
            [sortable]="true"
            [sort]="gridState.sort"
            filterable="menu"
            [filter]="gridState.filter"
            (dataStateChange)="onDataStateChange($event)"
          >
            <kendo-grid-column
              field="RailCarId"
              title="Railcar ID"
              [width]="150"
            >
            </kendo-grid-column>
            <kendo-grid-column
              field="CustomerAssigned"
              title="Customers Assigned"
              [width]="350"
            >
            </kendo-grid-column>
            <kendo-grid-column field="YardName" title="Yard" [width]="280">
            </kendo-grid-column>
            <kendo-grid-column field="FormName" title="Form Name" [width]="320">
            </kendo-grid-column
            ><kendo-grid-column field="UserEmail" title="User ID" [width]="320">
            </kendo-grid-column
            ><kendo-grid-column
              field="SubmittedDate"
              title="Submitted On"
              [width]="230"
              [filterable]="false"
            >
              <ng-template kendoGridCellTemplate let-inspection>
                {{
                  inspection.Status === 'Submitted'
                    ? (inspection.SubmittedDate | ipTimezone)
                    : 'N/A'
                }}
              </ng-template></kendo-grid-column
            ><kendo-grid-column
              field="UpdatedDate"
              title="Updated On"
              [width]="230"
              [filterable]="false"
            >
              <ng-template kendoGridCellTemplate let-customer>{{
                customer.UpdatedDate | ipTimezone
              }}</ng-template></kendo-grid-column
            ><kendo-grid-column field="Status" title="Status" [width]="150">
              <ng-template kendoGridCellTemplate let-dataItem>
                <span
                  [ngClass]="
                    dataItem.Status === 'Submitted'
                      ? 'sm-dot'
                      : dataItem.Status === 'Pending'
                        ? 'sm-dot-gray'
                        : ''
                  "
                  class="mt-1"
                ></span>
                &nbsp;{{ dataItem.Status }}
              </ng-template></kendo-grid-column
            ><kendo-grid-column
              field="actions"
              title="Actions"
              [width]="120"
              [headerStyle]="{ 'justify-content': 'center' }"
              [filterable]="false"
              [sortable]="false"
            >
              <ng-template kendoGridCellTemplate let-inspection>
                <div class="d-flex gap-4 justify-content-center">
                  <div
                    kendoTooltip
                    *ngIf="
                      (inspection.Status === 'Submitted' &&
                        userRole === 'Customer User') ||
                      userRole === 'Customer Viewer'
                    "
                  >
                    <a
                      title="View Form"
                      (click)="InspectionFormDetailGetById(inspection)"
                      style="cursor: pointer"
                    >
                      <app-viewicon />
                    </a>
                  </div>
                  <div
                    kendoTooltip
                    *ngIf="
                      inspection.Status === 'Pending' &&
                      userRole === 'Customer User'
                    "
                  >
                    <a
                      title="Edit Form"
                      (click)="InspectionFormDetailGetById(inspection)"
                      style="cursor: pointer"
                    >
                      <app-editicon />
                    </a>
                  </div>
                  <div kendoTooltip>
                    <a
                      style="cursor: pointer"
                      title="Download Form"
                      (click)="downloadPDF(inspection.FormName, inspection.Id)"
                    >
                      <app-download-icon />
                    </a>
                  </div>
                </div>
              </ng-template>
            </kendo-grid-column>
          </kendo-grid>
        </div>
      </div>
    </div>
  </div>
</app-module-layout>

<!-- PDF for download -->
<div #formContainer style="position: relative; top: 54px">
  <formio
    *ngIf="formReadyToRender"
    [src]="formUrl"
    [submission]="{ data: formData }"
    (ready)="onFormReady($event)"
    [readOnly]="true"
  ></formio>
</div>

<app-kendo-export-dialog
  *ngIf="exportDialogVisible"
  (closeDialog)="onExportDialogClose($event)"
/>

<app-kendo-loading-dialog
  [message]="'GENERATING PDF'"
  *ngIf="isPdfDownloading"
/>
