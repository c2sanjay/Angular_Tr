<kendo-dialog [minWidth]="280" [width]="580" [height]="350">

          height="96"
          viewBox="0 0 31 31"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"

          />
        </svg>
      </ng-container>

          height="96"

      <ng-container *ngSwitchCase="'success'">
        <svg
          width="96"
          height="96"
          viewBox="0 0 26 26"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path

          />

      </ng-container>
      <ng-container *ngSwitchCase="'info'">
        <svg
          width="96"
          height="96"
          viewBox="0 0 26 26"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12.75 0.5C5.85 0.5 0.25 6.1 0.25 13C0.25 19.9 5.85 25.5 12.75 25.5C19.65 25.5 25.25 19.9 25.25 13C25.25 6.1 19.65 0.5 12.75 0.5ZM12.75 19.25C12.0625 19.25 11.5 18.6875 11.5 18V13C11.5 12.3125 12.0625 11.75 12.75 11.75C13.4375 11.75 14 12.3125 14 13V18C14 18.6875 13.4375 19.25 12.75 19.25ZM14 9.25H11.5V6.75H14V9.25Z"
            fill="#346CAB"
          />
        </svg>
      </ng-container>
    </ng-container>
  </div>
  <h3 class="text-center">Are you sure?</h3>
  <p class="px-1 text-center">{{ message }}</p>
  <kendo-dialog-actions [layout]="'center'" class="d-flex gap-3 p-3 border-0">
    <button
      kendoButton
      (click)="onClose('dismiss')"
      themeColor="primary"
      fillMode="outline"
      class="px-5 h-40px"
    >
      DISMISS
    </button>
    <button
      kendoButton
      (click)="onClose('confirm')"
      themeColor="primary"
      class="px-5 h-40px"
    >
      CONFIRM
    </button>
  </kendo-dialog-actions>
</kendo-dialog>
