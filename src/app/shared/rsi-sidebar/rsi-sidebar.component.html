<button
  class="d-flex flex-column cursor-pointer position-fixed border-0 p-0"
  style="
    width: 60px;
    height: calc(100vh - 54px);
    background-color: #2c3c58;
    z-index: 99;
  "
  (click)="togglemenuPopup()"
  #menuAnchor
>
  <div
    class="d-flex flex-column h-100 justify-space-between align-items-center"
  >
    <div class="menu-list noHover w-100">
      <ul class="nav flex-column mt-2 text-white w-100">
        <li
          class="nav-item justify-content-center"
          [class.linkActive]="currentRoute.includes('/dashboard')"
        >
          <app-inspection-hubicon></app-inspection-hubicon>
        </li>
        <li
          class="nav-item justify-content-center"
          [class.linkActive]="
            currentRoute.includes('/form-management') ||
            currentRoute.includes('/form-overview')
          "
        >
          <app-formmgmticon></app-formmgmticon>
        </li>
        <li
          *ngIf="userRole === 'Super Admin'"
          class="nav-item justify-content-center"
          [class.linkActive]="
            currentRoute.includes('/customers') ||
            currentRoute.includes('/customer-details')
          "
        >
          <app-vendoricon></app-vendoricon>
        </li>
      </ul>
    </div>
    <div class="position-absolute" style="bottom: 36px">
      <div class="icon-container">
        <app-profilepic class="text-white"></app-profilepic>
      </div>
    </div>
  </div>
</button>
<div class="menu-backdrop">
  <div class="mat-drawer-backdrop" [class.show]="showMenu"></div>
  <div class="menu-list-container" [class.show]="showMenu">
    <div class="menu-list">
      <ul class="nav flex-column mt-2 text-white w-100">
        <li
          class="nav-item expanded"
          [class.linkActive]="currentRoute.includes('/dashboard')"
        >
          <a class="nav-link w-100 h-100" routerLink="/dashboard">
            <div class="icon-container">
              <app-inspection-hubicon></app-inspection-hubicon>
            </div>
            <span>Inspection Hub</span>
          </a>
        </li>
        <li
          class="nav-item expanded"
          [class.linkActive]="
            currentRoute.includes('/form-management') ||
            currentRoute.includes('/form-overview')
          "
        >
          <a class="nav-link w-100 h-100" routerLink="/form-management">
            <div class="icon-container">
              <app-formmgmticon></app-formmgmticon>
            </div>
            <span>Form Management</span>
          </a>
        </li>
        <li
          *ngIf="userRole === 'Super Admin'"
          class="nav-item expanded"
          [class.linkActive]="
            currentRoute.includes('/customers') ||
            currentRoute.includes('/customer-details')
          "
        >
          <a class="nav-link w-100 h-100" routerLink="/customers">
            <div class="icon-container">
              <app-vendoricon></app-vendoricon>
            </div>
            <span>Customer List</span>
          </a>
        </li>
      </ul>
    </div>
    <div
      class="ps-4 pe-3 position-absolute w-100"
      style="left: -4px; bottom: 18px"
    >
      <div
        class="d-flex justify-content-start align-items-center gap-3 text-white"
        style="border-radius: 0.375rem; border: 2px solid #346cab; padding: 8px"
      >
        <div class="icon-container">
          <app-profilepic class="text-white"></app-profilepic>
        </div>
        <div class="d-flex gap-1" style="flex-direction: column">
          <span class="text-capitalize fw-semibold" style="font-size: 13px">{{
            userDetails?.username
          }}</span>
          <span style="font-size: 12px">{{ userRole }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
